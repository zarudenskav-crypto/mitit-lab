<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>MITIT Under the Attack</title>

    <style>
        body {
            background: linear-gradient(135deg, #101820, #1b3040, #101820);
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .logo {
            width: 75px;
            height: 75px;
            border: 2px solid #9aabb7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-weight: bold;
            letter-spacing: 2px;
            color: white;
        }

        header {
            text-align: center;
            padding: 30px;
            background-color: #1c2b36;
            border-bottom: 2px solid #526b7a;
        }

        header h1 {
            letter-spacing: 3px;
        }

        header p {
            color: #9aabb7;
            letter-spacing: 2px;
        }

        main {
            text-align: center;
            margin-top: 80px;
        }

        .document-card {
            background-color: #1c2b36;
            max-width: 500px;
            margin: 40px auto;
            padding: 25px;
            border: 1px solid #526b7a;
            border-radius: 10px;
            text-align: left;
            transition: transform 0.3s ease;
        }

        .document-card:hover {
            transform: translateY(-5px);
        }

        .document-label {
            color: #9aabb7;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .document-card h2 {
            color: white;
            font-size: 21px;
            line-height: 1.5;
            margin-top: 20px;
        }

        .document-card p {
            color: #aab8c2;
        }

      a, button {
    display: inline-block;
    background-color: #526b7a;
    color: white;
    padding: 12px 20px;
    text-decoration: none;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 15px;
    font-family: Arial;
    transition: background-color 0.3s;
}

a:hover, button:hover {
    background-color: #718b9c;
}

    </style>
</head>

<body>

    <header>
        <div class="logo">MITIT</div>
        <h1>MITIT UNDER THE ATTACK</h1>
        <p>Заруденська В.С.</p>
    </header>

    <main>
        <div class="document-card">

            <span class="document-label">DOCUMENT ARCHIVE</span>

            <h2>ЧИСЛЕННОСТЬ ИНОСТРАННЫХ НАЕМНИКОВ НА УКРАИНЕ</h2>

            <p>Архівний документ від 17.06.2022</p>
            <p>Формат: PDF</p>

            <button onclick="showDemo()">
                Запустити демонстрацію
             </button>



        </div>
    </main>

</body>
<script>
function showDemo() {
    alert("MITIT UNDER THE ATTACK");
    window.open("decoy.pdf", "_blank");
}
</script>
</html>
